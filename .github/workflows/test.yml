name: test
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # for GITHUB_TOKEN
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          include-pre-releases: false
          repo-token: ${{ github.token }}

      - name: chmod to allow run script
        run: chmod +x ./scripts/install_deps

      - name: install dependencies
        run: ./scripts/install_deps

      - name: go tests
        env:
          SNET_ETHEREUM_JSON_RPC_HTTP_ENDPOINT: ${{secrets.ETH_JSON_HTTP_ENDPOINT}}
        run: go test -v ./...

      - name: Shutdown lifecycle race tests
        run: >-
          go test -race ./snetd/cmd ./lifecycle ./blockchain
          ./contract_event_listener ./metrics ./configuration_service ./handler
          ./handler/httphandler ./storage ./training ./escrow
          -count=2 -timeout=3m
