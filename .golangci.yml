version: "2"
run:
  concurrency: 4
  modules-download-mode: readonly
  issues-exit-code: 3
  tests: false
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bidichk
    - durationcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
  settings:
    staticcheck:
      # keep v1 behavior (staticcheck SA + gosimple S checks only),
      # exclude stylecheck (ST) and quickfix (QF) checks absorbed by staticcheck in v2
      checks:
        - all
        - -ST*
        - -QF*
    revive:
      enable-all-rules: false
      rules:
        - name: receiver-naming
          severity: warning
          disabled: false
          exclude:
            - ""
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - .pb
      - bin
      - build
      - \.git
      - third_party$
      - builtin$
      - examples$
formatters:
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
