syntax = "proto3";

package escrow;

option java_package = "io.singularitynet.daemon.escrow";
option go_package = "github.com/singnet/snet-daemon/v6/escrow";

// PaymentChannelStateService returns locally accepted payment state merged with
// blockchain channel details. Byte fields representing IDs, nonces, and amounts
// use unsigned big-endian encoding. Input channel IDs may have leading zero
// padding; populated numeric byte fields in replies use 32 bytes.
service PaymentChannelStateService {
  // GetChannelState requires a recent request signed by the channel signer,
  // sender, or recipient and includes the previous pending claim when needed.
  rpc GetChannelState(ChannelStateRequest) returns (ChannelStateReply) {}
}

// ChannelStateRequest authenticates a request for the latest channel state.
message ChannelStateRequest {
  // ID of the channel whose state is requested, as big-endian bytes.
  bytes channel_id = 1;

  // Ethereum signed-message signature over the concatenation
  // "__get_channel_state" || MPE address || channel ID || current_block.
  // The configured MPE address uses 20 raw bytes; channel ID and block use
  // 32-byte big-endian encoding. The signer must be a channel signer,
  // sender, or recipient.
  bytes signature = 2;

  // Request block number; the absolute difference from the daemon's latest
  // observed block must be at most five, including both boundaries.
  uint64 current_block = 3;
}

// ChannelStateReply contains the latest available nonce and payment authorization.
// Claim preparation advances the local nonce before blockchain settlement, so
// current_nonce can differ from the blockchain nonce. No channel balance is
// returned; amounts below are cumulative authorizations for their respective nonces.
message ChannelStateReply {
  // Latest available channel nonce, which can include a locally prepared claim.
  bytes current_nonce = 1;

  // Latest cumulative amount authorized for current_nonce. It is omitted when
  // no current signature exists and the local and blockchain nonces match.
  bytes current_signed_amount = 2;

  // Claim signature authorizing current_signed_amount at current_nonce.
  // Absent if no payment has been accepted at that nonce.
  bytes current_signature = 3;

  // Pending authorization for current_nonce - 1, included when the latest
  // available nonce differs from the blockchain nonce.
  bytes old_nonce_signed_amount = 4;

  // Claim signature for old_nonce_signed_amount at current_nonce - 1.
  bytes old_nonce_signature = 5;

  // Not populated by the current channel-state implementation; always zero.
  // TokenService.GetToken returns prepaid accounting counters.
  uint64 planned_amount = 6;

  // Not populated by the current channel-state implementation; always zero.
  // TokenService.GetToken returns prepaid accounting counters.
  uint64 used_amount = 7;
}
