syntax = "proto3";

package escrow;

option java_package = "io.singularitynet.daemon.escrow";
option go_package = "github.com/singnet/snet-daemon/v6/escrow";

// TokenService issues JWTs for prepaid calls, which share channel credit through
// atomic usage accounting rather than signing a new payment for each call.
// Query GetChannelState before choosing the current nonce and cumulative signed
// amount. The claim signature authorizes the provider to claim that amount,
// including credit intended for future calls.
service TokenService {
  // GetToken verifies the fresh request signature and the separate claim signature.
  // The nonce must match the latest channel state, and signed_amount must be
  // between the latest accepted authorization and the channel balance, inclusive.
  // A higher authorization is stored and its increase is added to planned usage.
  // An unchanged authorization can renew a JWT if a planned counter exists.
  // Remaining credit is checked when a prepaid call is charged, not on renewal.
  rpc GetToken(TokenRequest) returns (TokenReply) {}
}

// TokenRequest contains a claim authorization and a separately signed, recent
// token request. Both signatures use the Ethereum signed-message hashing described
// in the escrow package README.
message TokenRequest {
  // ID of the channel whose prepaid credit the JWT will authorize.
  uint64 channel_id = 1;
  // Latest available channel nonce, including locally prepared claims.
  uint64 current_nonce = 2;
  // Cumulative claim authorization at current_nonce, in token base units.
  // This is an absolute amount; only an increase adds new prepaid credit.
  uint64 signed_amount = 3;
  // Signature over raw claim_signature bytes || current_block, with the block
  // encoded as a 32-byte big-endian integer. This signer must be the channel
  // signer, sender, or recipient; it need not be the claim-signature signer.
  bytes signature = 4;
  // Request block number; the absolute difference from the daemon's latest
  // observed block must be at most five, including both boundaries.
  uint64 current_block = 5;

  // Signature authorizing the concatenation "__MPE_claim_message" || MPE address
  // || channel ID || current_nonce || signed_amount. The address uses 20 raw bytes;
  // numeric fields use 32-byte big-endian encoding. This signature must recover
  // to the channel signer or sender and is retained for a future provider claim.
  bytes claim_signature = 6;
}

// TokenReply contains the channel-bound JWT and stored prepaid accounting totals.
// The counters are keyed by channel ID, independently of its current nonce.
message TokenReply {
  // ID of the channel bound to the returned JWT.
  uint64 channel_id = 1;

  // JWT authorizing prepaid calls for this channel and the request signer.
  // Its expiry is configured by token_expiry_in_minutes.
  string token = 2;

  // Cumulative additional credit authorized for prepaid use, in token base units.
  // This counter spans nonce changes and is not the current channel balance.
  uint64 planned_amount = 3;

  // Cumulative call charges, in token base units. Includes failed calls credited
  // separately in the refund counter; this is not a net-spent amount.
  uint64 used_amount = 4;
}
