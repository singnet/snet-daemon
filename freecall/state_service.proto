syntax = "proto3";

// Preserve the namespace used by existing clients on the wire.
package escrow;

option java_package = "io.singularitynet.daemon.escrow";
// Avoid sharing escrow/state_service.proto's StateService.java output file.
// This changes the Java source API; see README.md for the client migration.
option java_outer_classname = "FreeCallState";
option go_package = "github.com/singnet/snet-daemon/v6/freecall";

// FreeCallStateService issues provider-signed free-call tokens and reports local
// usage allowances. Its historical escrow namespace does not imply MPE channel
// authorization: no channel ID, nonce, deposit, or claim signature is required.
// Registry provides metadata URIs; quotas and free-call signer addresses come
// from the selected service-group metadata and daemon configuration, not an
// on-chain free-call counter.
service FreeCallStateService {
  // Authenticate the caller and token, then return the remaining allowance.
  // This read neither consumes nor reserves a call.
  rpc GetFreeCallsAvailable(FreeCallStateRequest) returns (FreeCallStateReply) {}
  // Authenticate a recent caller request and issue a token. Ordinary wallets
  // must meet the configured ERC-20 wallet-balance minimum; trusted backends
  // may use user_id and skip that check. Issuance does not reset or reserve quota.
  rpc GetFreeCallToken(GetFreeCallTokenRequest) returns (FreeCallToken) {}
}

message GetFreeCallTokenRequest{
  // Caller's signing address as exact UTF-8 text. The request signature must
  // recover to this address. It may identify a wallet or a trusted backend.
  string address = 1;

  // Ethereum signed-message signature over the concatenation
  // "__prefix_free_trial" || address || user_id || organization_id || service_id
  // || group_id || current_block. Address and IDs are exact UTF-8 strings;
  // current_block uses 32-byte big-endian encoding. Organization/service IDs
  // come from daemon configuration, not padded Registry bytes32 keys; group_id
  // is the organization metadata's group ID string, not daemon_group_name.
  // The requested token lifetime is not part of this signed payload.
  bytes signature = 2;

  // Request block number, at most five blocks from the daemon's latest block
  // in either direction, including both boundaries.
  uint64 current_block = 3;

  // Optional end-user identity for callers in trusted_free_call_signers.
  // Other callers must omit this field or provide an empty string.
  optional string user_id = 4;

  // Lifetime measured from the daemon block read during issuance, not from
  // current_block or wall-clock time. Omission or a value above 172800 uses
  // the default 172800; zero expires at the issuance block, inclusively.
  optional uint64 token_lifetime_in_blocks = 5;
}


message FreeCallToken{
  // Raw token bytes: 65-byte provider signature || "_" || ASCII decimal deadline.
  // The signature covers organization ID || daemon_group_name || caller's raw
  // 20-byte address || user_id || 32-byte expiration block. Strings use UTF-8.
  // Unlike caller signatures, this payload omits the service ID and metadata
  // group ID. It contains no MPE/Registry address and is not an MPE claim or JWT.
  bytes token = 1;

  // Hex encoding of the full token without a 0x prefix. Decode it before using
  // binary gRPC metadata; do not send the hex text as raw token bytes.
  string token_hex = 2;

  // Daemon block at issuance plus the resolved lifetime. Tokens remain valid
  // at this block and expire afterward; request freshness is checked separately.
  uint64 token_expiration_block = 3;
}

message FreeCallStateRequest {
  // Caller address as exact UTF-8 text, matching the identity bound to the token.
  string address = 1;

  // Must match the identity used to issue the token. Nonempty IDs are issued
  // only to trusted backends; changing the ID invalidates token authorization.
  optional string user_id = 2;

  // Full raw token from GetFreeCallToken, including the expiration suffix.
  bytes free_call_token = 3;

  // Caller signature over "__prefix_free_trial" || address || user_id ||
  // organization_id || service_id || group_id || current_block || free_call_token.
  // Strings and block encoding match GetFreeCallTokenRequest; the complete raw
  // token bytes are appended. The caller signs this request, while the provider's
  // free_call_signer_address signs the token itself. Service calls use this same
  // payload through the free-call gRPC metadata headers.
  bytes signature = 4;

  // Request block number with the same inclusive five-block freshness window.
  uint64 current_block = 5;
}

message FreeCallStateReply {
  // Remaining calls after committed usage, clamped to zero when exhausted.
  // The legacy sentinel 99999999 represents an unlimited free_calls_per_address
  // override in daemon configuration.
  uint64 free_calls_available = 1;
}
